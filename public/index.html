<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Helm · Claude Code 驾驶舱</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-scan"></div>
  <div class="grain"></div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <h1>HELM</h1>
          <div class="sub">CLAUDE CODE 驾驶舱 · 多会话控制</div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="live"><span class="dot"></span><span id="live-clock">已同步</span></div>
      <button class="btn-refresh" id="theme-toggle" title="切换亮/暗主题" style="padding:8px 12px">
        <span id="theme-ico">☀</span>
      </button>
      <button class="btn-refresh" id="refresh">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        重新扫描
      </button>
    </header>

    <section class="statrail" id="statrail"></section>

    <section class="panel" id="token-panel"></section>

    <div class="section-head">
      <h2>活跃项目</h2>
      <span class="meta" id="proj-meta">扫描中…</span>
      <div class="toolbar" id="filters">
        <button class="chip-filter on" data-f="all">全部</button>
        <button class="chip-filter" data-f="progress">进行中</button>
        <button class="chip-filter" data-f="memory">有记忆</button>
      </div>
    </div>

    <section class="grid" id="grid"></section>
  </div>

  <!-- drill-down drawer -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head" id="drawer-head"></div>
    <nav class="tabs" id="drawer-tabs"></nav>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div id="dock"></div>
  <div id="mindock"></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
